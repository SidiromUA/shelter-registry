# Профіль dev — розроблення: БД H2 у пам’яті, нічого встановлювати не потрібно.
# Схему і тестові дані створює Flyway (db/migration) під час кожного запуску.

spring:
  datasource:
    url: jdbc:h2:mem:shelters;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    show-sql: true                   # друкувати SQL, який формує Hibernate
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true                  # вебконсоль БД: http://localhost:8080/h2-console

logging:
  level:
    ua.edu.ldubgd.shelters: DEBUG    # детальні журнали нашого коду
    org.hibernate.orm.jdbc.bind: TRACE     # значення параметрів SQL-запитів
