# Профіль prod — промислова експлуатація: PostgreSQL, параметри — зі змінних оточення.
# Паролі не зберігаються в репозиторії!

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shelter_registry}
    username: ${DB_USER:shelter}
    password: ${DB_PASSWORD:shelter}
    hikari:
      maximum-pool-size: 10
  flyway:
    baseline-on-migrate: true        # БД, створену вручну в ЛР2–7 (схема + дані),
    baseline-version: 2              # Flyway вважатиме вже застосованими міграції V1 і V2

logging:
  level:
    ua.edu.ldubgd.shelters: INFO
  file:
    name: logs/shelter-registry.log  # журнал у файл (ротація — автоматично)
