# ЛР6. Застосунок + PostgreSQL однією командою:  docker compose up --build
# Застосунок: http://localhost:8080/api/shelters, стан: http://localhost:8080/actuator/health
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: shelter_registry
      POSTGRES_USER: shelter
      POSTGRES_PASSWORD: shelter
    volumes:
      - db-data:/var/lib/postgresql/data
      # схему і дані створює Flyway під час запуску застосунку (ЛР8)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelter -d shelter_registry"]
      interval: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/shelter_registry
      DB_USER: shelter
      DB_PASSWORD: shelter
    ports:
      - "8080:8080"

volumes:
  db-data:
